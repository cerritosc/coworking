spring:
  application:
    name: coworking
  
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
    
application:
  name: Coworking API
  
jwt:
  secret: 3F91D0F8A44B1E6D4A3F97C9F4D88E12B8D5F5E3A9B0C1D2E3F4A5B6C7D8E9F0A1B2C3D4E5F60718293A4B5C6D7E8F90
  expiration: 3600000
  
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    
management:

  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
        
external:
  payment:
    base-url: http://localhost:8080/mock
    
resilience4j:
  circuitbreaker:
    instances:
      payment-service:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 10s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: true